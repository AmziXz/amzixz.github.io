# Photos that slot into the design. Leave a value "" and the design works
# without it; put a file in assets/photos/ and its path here to switch it on.
# See assets/photos/README.md for sizes.

# You on the first screen, stepping out of the ring light: head and
# shoulders above the ring, the rest of you inside it down to mid-thigh,
# the giant AmziXz across your legs. It has to be a cut-out (transparent
# background) framed on the ring like hero-cutout-nobottle.webp: as wide
# as the ring, the ring's bottom along the bottom edge, and your head and
# shoulders in the extra height above. 800×1224px; see
# assets/photos/README.md. hero-cutout.webp is the same photo with the
# bottle still in your hand: either path works.
hero: "/assets/photos/hero-cutout-nobottle.webp"

# A portrait for the About page, beside the title. Portrait shape (4:5),
# about 1000×1250px.
about: ""

# The two photos in "The work" on the home page.
work_phone: "/assets/photos/work-phone.jpg"
work_cars: "/assets/photos/work-cars.jpg"
