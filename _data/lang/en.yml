# THE OTHER PAGES

about:
  label: "About"
  title: "I'm AmziXz."
  lede: "Content creator from Latvia. I make things, I break things on purpose, and lately I've started building companies around the things I care about."
  # Read out for your photo, once there is one (_data/photos.yml)
  photo_alt: "AmziXz"
  # Each section: a small label, a title, then its paragraphs in order
  sections:
    - label: "On camera"
      title: "What I make"
      text:
        - "On YouTube I mod phone software: custom ROMs, root, debloating, and generally pushing devices past what they shipped with. I do it because I'm into IT and electronics, and I run every step on my own hardware first, which is why the tutorials work instead of bricking your phone."
        - "On TikTok I make car content and stream live. Unedited, on the move, whatever's actually happening. Everything gets shot on my phone with a DJI Osmo Mobile 8 gimbal and cut in DaVinci Resolve."
    - label: "Off camera"
      title: "What I'm building"
      text:
        - "I co-own Blue Eye Energy, an energy drink company I'm building with a friend. It isn't on shelves yet: we're still assembling the pieces, and we're currently raising."
        - "I also run AmziXz Services. We build websites, tools and apps for people, or lay the groundwork that a larger development team can take further."
        - "Longer term I want to build in the places I already spend my time: car tuning, parts, reengineered classic components that outlast the originals, and logistics. Those are plans rather than businesses today, and the ventures list on the home page says which is which."
  next_label: "Next"
  next_title: "Where to go from here"
  next_text: "If you're here for one of these things, you'll probably tolerate the rest."
  next_cta: "See the work"
  next_secondary: "What I'm building"

uses:
  label: "Uses"
  title: "What I use."
  lede: "The gear and software behind the videos and the streams. People ask about this constantly, so here it is in one place. Everything listed is what I actually use: no affiliate links, nothing I haven't touched."
  # Each group: a title, then name and value pairs.
  groups:
    - title: "Phones"
      items:
        - name: "Daily driver"
          value: "Nothing Phone (2), on Nothing OS for now, moving to Infinity X"
        - name: "Test device"
          value: "Poco X3 Pro (codename vayu), the one I flash first so you don't have to"
        - name: "Privacy phone"
          value: "A separate device running GrapheneOS"
        - name: "ROMs I run most"
          value: "Infinity X, GrapheneOS, Nothing OS"
    - title: "Modding tools"
      items:
        - name: "Recovery"
          value: "OrangeFox, on anything with an unlocked bootloader"
        - name: "Root"
          value: "KernelSU Next, or Magisk Kitsune"
    - title: "Filming & streaming"
      items:
        - name: "Camera"
          value: "My daily driver, the Nothing Phone (2)"
        - name: "Gimbal"
          value: "DJI Osmo Mobile 8"
        - name: "Lighting"
          value: "None. Whatever light is in the room."
        - name: "Editing"
          value: "DaVinci Resolve Studio"
  # The "for sale" box sits under the group with this number (1 = the
  # first one above). 0 means no box, which is how it is now: write the
  # three lines below, put the number of the group, and it appears.
  sale_group: 0
  sale_label: "For sale"
  sale_text: "Everything in this list is for sale right now."
  sale_price: "€2000"
  sale_cta: "Message me on Telegram"
  next_cta: "See the work"
  next_secondary: "Ask me about something"

contact:
  label: "Contact"
  title: "Say hi."
  lede: "Questions, collab ideas, or just want to say hi? Any of these work."
  reach_label: "Reach out"
  reach_title: "The quickest ways in"
  reach_note: "Telegram is the fastest: I check it more than anything else. Email is better if it needs a paper trail."
  channels_label: "Channels"
  channels_title: "Everywhere else"
  faq_label: "Questions"
  faq_title: "Questions I get a lot"
  # Shown in this order. Each one opens when clicked.
  faq:
    - question: "What's the fastest way to reach you?"
      answer: "Telegram, at t.me/AmziXz. I check it more than email, so you'll hear back sooner there."
    - question: "What do you actually make?"
      answer: "Phone modding guides (custom ROMs, rooting, debloating) on @PhoneGuruAmziXz, and car content and live streams on TikTok. Everything else goes on @AmziXz."
    - question: "What is Blue Eye Energy?"
      answer: "An energy drink company I co-own with a friend. It isn't on shelves yet: we're still building it, and we're currently raising."
    - question: "What is AmziXz Services?"
      answer: "We build websites, tools and apps for people, or lay the groundwork that a larger development team can take further. Everything about it is at services.amzixz.id.lv."
    - question: "Are you open to sponsorships and partnerships?"
      answer: "Yes: sponsorships, partnerships, and building with other creators. Telegram is fastest; email if it needs a paper trail. Tell me what you have in mind rather than sending a template, and I'll actually reply."
    - question: "Are you open to collabs?"
      answer: "Yes, collabs and feedback both. Message me on Telegram and tell me what you have in mind."

