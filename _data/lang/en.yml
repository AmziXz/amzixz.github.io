# ENGLISH: every word on amzixz.id.lv
#
# HOW TO EDIT
#   Change the text between the double quotes. Leave everything else alone.
#
#     tagline_1: "Curious about everything."    <- change this part
#     ^^^^^^^^^                                     never this part (the key)
#
#   - Keep the double quotes around every text.
#   - To use a double quote inside a text, use the curly ones: “like this”.
#   - Lines starting with # are notes like this one. They never show on the site.
#   - The name is always written AmziXz.
#   - lv.yml has exactly the same keys. If you add or remove a line here, do
#     the same there.
#
# IF YOU MAKE A MISTAKE
#   The site will not publish the change. The previous version stays live and
#   GitHub emails you that the Pages build failed. Undo the edit (or fix the
#   quote/indent you broke) and commit again.

