  faq:
    - question: "Kā ar tevi visātrāk sazināties?"
      answer: "Telegram, t.me/AmziXz. Tur skatos biežāk nekā e-pastā, tāpēc atbildi saņemsi ātrāk."
    - question: "Ko tu īsti veido?"
      answer: "Telefonu modificēšanas pamācības (pielāgotās ROM, root, liekās programmatūras noņemšana) kanālā @PhoneGuruAmziXz un auto saturu un tiešraides TikTok. Viss pārējais nonāk kanālā @AmziXz."
