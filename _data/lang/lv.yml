      answer: "Enerģijas dzēriena uzņēmums, kura līdzīpašnieks esmu kopā ar draugu. Tas vēl nav veikalos: mēs to joprojām veidojam un šobrīd piesaistām investīcijas."
    - question: "Kas ir AmziXz Services?"
      answer: "Veidojam mājaslapas, rīkus un lietotnes cilvēkiem vai ieliekam pamatu, ko lielāka izstrādātāju komanda var attīstīt tālāk. Viss par to ir lapā services.amzixz.id.lv."
    - question: "Vai esi atvērts sponsorēšanai un partnerībām?"
      answer: "Jā: sponsorēšanai, partnerībām un kopīgiem projektiem ar citiem satura veidotājiem. Telegram ir ātrākais; e-pasts, ja vajag rakstisku pierakstu. Pastāsti, ko esi iedomājies, nevis sūti sagatavi, un es tiešām atbildēšu."
    - question: "Vai esi atvērts sadarbībām?"
      answer: "Jā, gan sadarbībām, gan atsauksmēm. Raksti Telegram un pastāsti, ko esi iedomājies."

