# LATVIEŠU: visi vārdi lapā amzixz.id.lv/lv/
#
# KĀ LABOT
#   Maini tekstu starp pēdiņām. Visu pārējo atstāj, kā ir.
#
#     tagline_1: "Ziņkārīgs par visu."    <- maini šo daļu
#     ^^^^^^^^^                               nekad šo (atslēgu)
#
#   - Katram tekstam jāpaliek pēdiņās "…".
#   - Ja tekstā vajag pēdiņas, lieto latviešu „šādas”.
#   - Rindas, kas sākas ar #, ir piezīmes kā šī. Lapā tās neparādās.
#   - Vārds vienmēr tiek rakstīts AmziXz.
#   - en.yml ir tieši tādas pašas atslēgas. Ja šeit pievieno vai dzēs rindu,
#     dari to pašu tur.
#
# JA KAUT KO SALAUZ
#   Izmaiņas netiks publicētas. Iepriekšējā versija paliek tiešsaistē, un
#   GitHub atsūta e-pastu, ka Pages būvējums neizdevās. Atsauc labojumu (vai
#   izlabo salauzto pēdiņu/atkāpi) un saglabā vēlreiz.

# Ko meklētājprogrammas un saišu priekšskatījumi rāda par katru lapu
meta:
