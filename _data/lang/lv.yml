  # Sākumlapa
  home:
    title: "AmziXz · Telefonu modificēšana, auto un tiešraides"
    description: "AmziXz modificē telefonu programmatūru YouTube (pielāgotās ROM, root, liekās programmatūras noņemšana), veido auto saturu un tiešraides TikTok un ir Blue Eye Energy līdzīpašnieks Latvijā."
  job_title: "Satura veidotājs"

